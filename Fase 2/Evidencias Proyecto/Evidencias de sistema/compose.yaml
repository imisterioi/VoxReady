# VoxReady — entorno de DESARROLLO (no usar en producción).
#
#   docker compose up -d          # levanta los 4 servicios
#   docker compose logs -f        # logs de todos
#   docker compose down           # detiene (conserva volúmenes y datos)
#
# Recarga automática (NO desactivar: es requisito del entorno de desarrollo):
#   frontend -> HMR de Vite (bind mount + CHOKIDAR_USEPOLLING; sondeo cada 1,5 s)
#   backend  -> nodemon --legacy-watch (sondeo cada 1,5 s, fiable en bind mounts de Windows)
#   whisper  -> uvicorn --reload --reload-delay 2 (recarga el proceso; los modelos se
#               leen de la caché)
#   postgres -> no se reinicia por cambios de código
#
# Rendimiento (medido): el sondeo de chokidar a 100 ms (valor por defecto) sobre el
# bind mount de Windows costaba ~27 % de un núcleo POR VIGILANTE (Vite y nodemon) y
# ~7 % más el StatReload de uvicorn, en reposo y sin nadie usando la aplicación.
# Con CHOKIDAR_INTERVAL=1500 y --reload-delay 2 se mantienen exactamente las mismas
# capacidades de recarga consumiendo una fracción de CPU. El sondeo (y no inotify) es
# obligatorio mientras el código viva en el sistema de archivos de Windows: en WSL2
# inotify no propaga eventos desde el host (docker/for-win#12766, microsoft/WSL#4739).
#
# AVISO IMPORTANTE sobre el volumen de PostgreSQL:
#   El entorno actual (contenedores manuales) guarda los datos en el volumen anónimo
#   f79952eb178cad11cfcb7a48e122c1b00c21eb96e46fdef5bb9b8839dca7f389.
#   Aquí se declara como EXTERNO para reutilizar exactamente esos datos.
#   Dos servidores PostgreSQL NO pueden usar el mismo directorio de datos a la vez:
#   hay que detener el contenedor manual `voxready-postgres` antes de levantar este
#   compose (el volumen no se toca). Si algún día cambia ese volumen, actualiza
#   PGDATA_VOLUME en .env.

name: voxready-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-voxready_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-voxready_db}"]
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 10s

  whisper:
    build:
      context: ./backend/whisper
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      WHISPER_HOST: 0.0.0.0
      WHISPER_PORT: "8001"
      WHISPER_MODELS: ${WHISPER_MODELS:-base,small,medium}
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      WHISPER_MAX_MB: ${WHISPER_MAX_MB:-25}
      WHISPER_MAX_AUDIO_SECONDS: ${WHISPER_MAX_AUDIO_SECONDS:-600}
      WHISPER_MAX_CONCURRENCY: ${WHISPER_MAX_CONCURRENCY:-1}
      PYTHONDONTWRITEBYTECODE: "1"
    # --reload vigila /app (código montado). Sin watchfiles, uvicorn usa StatReload
    # (sondeo), que funciona con bind mounts de Windows.
    # --reload-delay 2: StatReload hace rglob("*.py") + stat de cada archivo en cada
    # ciclo. El valor por defecto (0,25 s) costaba ~7 % de un núcleo en reposo sobre el
    # bind mount; con 2 s sigue recargando automáticamente, con 8x menos sondeos.
    command:
      - python
      - -m
      - uvicorn
      - server:app
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --reload
      - --reload-dir
      - /app
      - --reload-delay
      - "2"
    volumes:
      - ./backend/whisper:/app
      # Caché de modelos ya descargada: no se vuelve a descargar al reiniciar.
      - ${HF_CACHE:-C:/Users/a/.cache/huggingface}:/root/.cache/huggingface
    ports:
      - "${WHISPER_PORT:-8001}:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).status==200 else 1)"
      # 30 s: se conserva la comprobación y el criterio de salud; solo cambia la frecuencia.
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: "3000"
      # Compose gana a dotenv (dotenv no sobreescribe variables ya definidas).
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-voxready_db}?schema=public
      WHISPER_URL: http://whisper:8001
      # OBLIGATORIO mientras el código se monte desde Windows: en WSL2 inotify no
      # propaga eventos desde el sistema de archivos del host, así que el sondeo es
      # la única forma de que nodemon detecte cambios (ver README/notas del entorno).
      CHOKIDAR_USEPOLLING: "true"
      # Sondeo cada 1,5 s en lugar de cada 100 ms (el valor por defecto de chokidar).
      # nodemon pasa `interval: undefined` a chokidar y chokidar lee CHOKIDAR_INTERVAL
      # al final, así que esta variable SÍ manda. Reduce ~15x los stat() sobre el bind
      # mount de Windows sin desactivar la recarga automática.
      CHOKIDAR_INTERVAL: "1500"
    # Arranque del backend con migraciones automáticas (scripts/docker-start.sh):
    #   1) espera a que PostgreSQL acepte conexiones;  2) genera el cliente Prisma;
    #   3) aplica las migraciones PENDIENTES con `prisma migrate deploy` (nunca `migrate dev`
    #      ni `reset`: no crea migraciones ni borra datos);  4) comprueba el estado.
    # Si algo falla, el contenedor termina y el servidor NO arranca: nunca atiende peticiones
    # con migraciones pendientes. `exec "$@"` deja a nodemon como PID 1 (recibe las señales de
    # Docker directamente, igual que antes).
    command:
      - sh
      - /app/scripts/docker-start.sh
      - node
      - /app/node_modules/nodemon/bin/nodemon.js
      - --legacy-watch
      - index.js
    volumes:
      # Código del host: incluye uploads/ (los videos existentes se conservan).
      - ./backend:/app
      # node_modules de Linux dentro del contenedor (no el de Windows).
      - /app/node_modules
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      whisper:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      # 30 s: misma comprobación; el arranque lo cubre start_period y depends_on.
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      CHOKIDAR_USEPOLLING: "true"
      # Igual que en el backend: chokidar es el vigilante que usa Vite (por debajo de
      # server.watch) y lee CHOKIDAR_INTERVAL, así que basta esta variable para sondear
      # cada 1,5 s en lugar de cada 100 ms. La recarga en caliente (HMR) sigue activa.
      CHOKIDAR_INTERVAL: "1500"
      # Lo usa el NAVEGADOR, por eso apunta al puerto publicado del backend.
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    # Se ejecuta Vite directamente (en lugar del CMD de la imagen, que era
    # `npm run dev -- --host 0.0.0.0`): elimina los procesos `npm`/`sh` que solo hacían
    # de intermediarios y deja a Vite como PID 1 (recibe las señales de Docker él mismo).
    # La recarga en caliente no cambia: sigue gobernada por CHOKIDAR_USEPOLLING/INTERVAL.
    command: ["node", "/app/node_modules/vite/bin/vite.js", "--host", "0.0.0.0"]
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      # 30 s: misma comprobación; el arranque lo cubre start_period.
      interval: 30s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  # Volumen EXISTENTE con los datos actuales. No se crea ni se borra desde aquí.
  pgdata:
    external: true
    name: ${PGDATA_VOLUME:-f79952eb178cad11cfcb7a48e122c1b00c21eb96e46fdef5bb9b8839dca7f389}
